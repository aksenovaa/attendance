version: 1
rules:
  r1_glitch_pair_max_min: 5        # delta ≤ 5 мин без смены → глюк-пара
  r6_paper_workly_max_min: 30      # расхождение бумага/Workly > 30 мин → «сверить»
  r8_night_plausible_min: [600, 1140]   # 10–19 ч — правдоподобная ночная смена
  check1_tolerance: per_worked_row # ≤ 1 мин на рабочую строку (отбрасывание секунд)

# R9 SYNTH-TOTAL: сотрудник назвал только сумму часов за месяц
synthesis:
  total_only:
    start_base: "09:00"
    start_jitter_min: 20       # хаотично ±20 мин, но детерминированно (seed)
    end_base: "19:00"          # конец ~19:00, может задерживаться (длительность из суммы)
    sunday: off                # воскресенья не работаем
    saturday_keep_prob: 0.5    # часть суббот пропускаем
    typical_day_min: 600       # ~10 ч/день → из суммы выводим число рабочих дней

# Эмпирические константы. Любое изменение — ADR + пересборка golden.
pair:
  max_minutes: 1560        # 26 ч: пропускает 24:23, отсекает склейку через выходные
anomaly:
  glitch_minutes: 5        # R1: глюк-пара
  long_shift_minutes: 840  # R6: длинная смена (14 ч)
paper:
  tolerance_minutes: 30    # R7: допуск бумаги ±30 мин
t12:
  known_defect: doubled    # work_time = 2 × реальное; менять на 'fixed' после фикса вендора
  tolerance_minutes: 1
